# Mapa do CAT793F (version 2). Frame: sinais do simulador, sem transformação.
# Unidades: km/h (speed), ms (stale_ms), ASCII int8 (lever_codes).
vipee_bridge:
  ros__parameters:
    map_version: 2
    vehicle: cat793f
    namespace: cat793f
    stale_ms: 500
    speed:
      source: telemetry.speed
      scale: 0.277777778  # km/h -> m/s
      max_abs_kmh: 80.0   # inclusivo
    current_gear:
      source: telemetry.gear
    gear_selection:
      source: lever
      lever_codes: [80, 82, 78, 68, 49, 50]  # P R N D 1 2
      lever_gears: [PARK, REVERSE, NEUTRAL, DRIVE, GEAR_1, GEAR_2]
    parking_brake:
      source: apply_control_to_vehicle.handbrake
    cameras:
      front:
        evs: FRONTVIEW
        topic: /sirv/sensor/fisheye/front/image/compressed
        device: /dev/video10
        width: 1280  # px
        height: 720  # px
        stale_ms: 500
      rear:
        evs: REARVIEW
        topic: /sirv/sensor/fisheye/rear/image/compressed
        device: /dev/video11
        width: 1280
        height: 720
        stale_ms: 500
      left:
        evs: LEFTVIEW
        topic: /sirv/sensor/fisheye/left/image/compressed
        device: /dev/video12
        width: 1280
        height: 720
        stale_ms: 500
      right:
        evs: RIGHTVIEW
        topic: /sirv/sensor/fisheye/right/image/compressed
        device: /dev/video13
        width: 1280
        height: 720
        stale_ms: 500
