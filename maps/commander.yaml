# Mapa do Commander (version 2): GEAR_SELECTION derivada da marcha engatada.
# Unidades: km/h (speed), ms (stale_ms).
vipee_bridge:
  ros__parameters:
    map_version: 2
    vehicle: commander
    namespace: commander
    stale_ms: 500
    speed:
      source: telemetry.speed
      scale: 0.277777778  # km/h -> m/s
      max_abs_kmh: 220.0  # inclusivo
    current_gear:
      source: telemetry.gear
    gear_selection:
      source: derived
    parking_brake:
      source: apply_control_to_vehicle.handbrake
    cameras:
      front:
        evs: FRONTVIEW
        topic: /sirv/sensor/fisheye/front/image/compressed
        device: /dev/video40
        width: 1280  # px
        height: 720  # px
        stale_ms: 500
      rear:
        evs: REARVIEW
        topic: /sirv/sensor/fisheye/rear/image/compressed
        device: /dev/video41
        width: 1280
        height: 720
        stale_ms: 500
      left:
        evs: LEFTVIEW
        topic: /sirv/sensor/fisheye/left/image/compressed
        device: /dev/video42
        width: 1280
        height: 720
        stale_ms: 500
      right:
        evs: RIGHTVIEW
        topic: /sirv/sensor/fisheye/right/image/compressed
        device: /dev/video43
        width: 1280
        height: 720
        stale_ms: 500
